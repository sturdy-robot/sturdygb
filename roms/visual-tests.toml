# General-purpose manifest for batch test ROM capture.
#
# Each case or suite produces grouped screenshot and metadata artifacts beneath one
# output root, plus a single TSV summary and HTML report at the top level.
# The HTML report shows serial output inline, which is often more useful than the
# framebuffer for serial-driven ROMs.
#
# `cases` are explicit one-off ROMs.
# `suites` expand a directory into multiple cases that share the same capture config.

[[cases]]
name = "blargg-cpu-instrs"
palette = "classic-green"
output_subdir = "blargg"
rom = "cpu_instrs.gb"
model_selection = "Auto"
step_limit = 32000000

[cases.stop_condition]
type = "serial-contains"
needle = "Passed all tests"

[[cases]]
name = "blargg-instr-timing"
palette = "classic-green"
output_subdir = "blargg"
rom = "gb-test-roms/instr_timing/instr_timing.gb"
model_selection = "Auto"
step_limit = 12000000

[cases.stop_condition]
type = "serial-contains"
needle = "Passed"

[[cases]]
name = "blargg-mem-timing"
palette = "classic-green"
output_subdir = "blargg"
rom = "gb-test-roms/mem_timing/mem_timing.gb"
model_selection = "Auto"
step_limit = 12000000

[cases.stop_condition]
type = "serial-quiet-steps"
quiet_steps = 500000
min_steps = 250000
min_serial_bytes = 1

